<!DOCTYPE html>
<html>
<head>
    <title>Exame App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Bem-vindo ao Exame!</h1>
        <p>Teste seus conhecimentos respondendo às questões.</p>
        
        <div class="upload-section">
            <h2>Escolha o arquivo de questões:</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group mb-3">
                    <label for="question_file">Selecione o arquivo JSON com as questões:</label>
                    <input type="file" class="form-control" id="question_file" name="question_file" accept=".json" required>
                </div>
                <div class="form-group mb-3">
                    <label for="exam_description">Descrição do Exame:</label>
                    <input type="text" class="form-control" id="exam_description" name="exam_description" 
                           placeholder="Ex: Exame de Certificação Python" maxlength="100">
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Exame</button>
            </form>
            <p class="file-hint">Selecione um arquivo JSON com as questões do exame</p>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; {{ year }} - Naldo Pinheiro - <a href="mailto:naldo.pinheiro@nap.tec.br">naldo.pinheiro@nap.tec.br</a></p>
    </footer>
</body>
</html>
